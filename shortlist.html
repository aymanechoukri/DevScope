<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <title>DevScope | Shortlist</title>
  </head>
  <body class="bg-gray-950 text-white overflow-hidden">
    <header
      class="relative z-20 flex w-[90%] lg:w-[80%] mx-auto my-8 items-center justify-between gap-4 rounded-full border border-white/10 bg-white/[0.06] backdrop-blur-xl shadow-[0_8px_35px_rgba(142,30,162,0.2)] px-5 py-3 before:content-[''] before:absolute before:inset-0 before:rounded-full before:border before:border-white/10 before:pointer-events-none"
    >
      <a href="./index.html" class="relative z-10 shrink-0">
        <img
          src="./assets/Image/logo.png"
          alt="DevScope Logo"
          class="w-24 md:w-28 object-contain"
        />
      </a>

      <nav class="relative z-10">
        <ul class="flex items-center gap-2 md:gap-4">
          <li>
            <a
              href="./index.html"
              class="block rounded-full border border-[#8E1EA2]/40 bg-[#8E1EA2]/15 px-5 py-2.5 text-sm font-semibold transition-all duration-300 hover:bg-[#8E1EA2]/30 hover:border-[#D552A3]/70 hover:shadow-[0_0_20px_rgba(142,30,162,0.4)]"
            >
              Recherche
            </a>
          </li>

          <li>
            <a
              href="./shortlist.html"
              class="block rounded-full border border-white/10 bg-white/5 px-5 py-2.5 text-sm font-semibold transition-all duration-300 hover:bg-[#D552A3]/15 hover:border-[#D552A3]/50 hover:shadow-[0_0_20px_rgba(213,82,163,0.3)]"
            >
              Shortlist
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div
        class="absolute w-[550px] h-[550px] rounded-full bg-[#8E1EA2]/20 blur-[140px] -top-[250px] -left-[200px]"
      ></div>

      <div
        class="absolute w-[450px] h-[450px] rounded-full bg-[#D552A3]/15 blur-[130px] -top-[150px] -right-[150px]"
      ></div>

      <div
        class="absolute w-[700px] h-[400px] rounded-full bg-[#8E1EA2]/15 blur-[150px] top-[30%] left-1/2 -translate-x-1/2"
      ></div>

      <div
        class="absolute w-[500px] h-[500px] rounded-full bg-[#D552A3]/10 blur-[140px] -bottom-[250px] -left-[200px]"
      ></div>

      <div
        class="absolute w-[600px] h-[500px] rounded-full bg-[#8E1EA2]/20 blur-[150px] -bottom-[250px] -right-[200px]"
      ></div>

      <div
        class="absolute w-[900px] h-[180px] rotate-[-25deg] rounded-full bg-[#D552A3]/10 blur-[100px] top-[45%] -left-[200px]"
      ></div>
    </div>

    <main>
      <section class="flex flex-col gap-5 p-10">
        <div
          class="pointer-events-none absolute -right-20 -top-20 h-64 w-64 rounded-full bg-[#8E1EA2]/10 blur-[100px]"
        ></div>
        <div
          class="pointer-events-none absolute -bottom-20 -left-20 h-64 w-64 rounded-full bg-[#D552A3]/10 blur-[100px]"
        ></div>

        <div
          class="relative z-10 flex flex-col justify-between gap-4 sm:flex-row sm:items-center"
        >
          <div>
            <h2
              class="bg-gradient-to-r from-[#D552A3] to-[#8E1EA2] bg-clip-text text-3xl font-bold text-transparent"
            >
              Ma shortlist
            </h2>
            <p class="mt-2 text-sm text-gray-400">
              <span class="font-bold text-[#D552A3]">1</span>
              candidat(s) dans votre shortlist
            </p>
          </div>

          <div
            class="flex h-12 w-12 items-center justify-center rounded-xl border border-[#D552A3]/20 bg-[#D552A3]/10 text-[#D552A3]"
          >
            <i class="fa-solid fa-bookmark text-xl"></i>
          </div>
        </div>

        <form
          action=""
          class="relative z-10 flex flex-col justify-between gap-5 lg:flex-row lg:items-center"
        >
          <ul class="flex flex-wrap items-center gap-2 text-sm">
            <li>
              <button
                type="button"
                class="rounded-xl border border-[#D552A3]/40 bg-gradient-to-r from-[#8E1EA2]/30 to-[#D552A3]/20 px-4 py-2 font-semibold text-[#F49ACD] shadow-[0_0_15px_rgba(213,82,163,0.12)] transition-all hover:scale-105"
              >
                Tous
              </button>
            </li>

            <li>
              <button
                type="button"
                class="rounded-xl border border-white/10 bg-white/[0.04] px-4 py-2 text-gray-400 transition-all hover:border-[#D552A3]/40 hover:bg-[#D552A3]/10 hover:text-white"
              >
                A contacter
              </button>
            </li>

            <li>
              <button
                type="button"
                class="rounded-xl border border-white/10 bg-white/[0.04] px-4 py-2 text-gray-400 transition-all hover:border-[#D552A3]/40 hover:bg-[#D552A3]/10 hover:text-white"
              >
                Entretien
              </button>
            </li>

            <li>
              <button
                type="button"
                class="rounded-xl border border-white/10 bg-white/[0.04] px-4 py-2 text-gray-400 transition-all hover:border-[#D552A3]/40 hover:bg-[#D552A3]/10 hover:text-white"
              >
                Retenu
              </button>
            </li>

            <li>
              <button
                type="button"
                class="rounded-xl border border-white/10 bg-white/[0.04] px-4 py-2 text-gray-400 transition-all hover:border-[#D552A3]/40 hover:bg-[#D552A3]/10 hover:text-white"
              >
                Refusé
              </button>
            </li>
          </ul>

          <div class="group relative w-full lg:w-72">
            <i
              class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 transition-colors group-focus-within:text-[#D552A3]"
            ></i>

            <input
              type="search"
              placeholder="Rechercher un candidat..."
              class="w-full rounded-xl border border-white/10 bg-white/[0.04] py-3 pl-11 pr-4 text-sm text-white outline-none transition-all placeholder:text-gray-500 focus:border-[#D552A3]/50 focus:bg-[#D552A3]/[0.05] focus:shadow-[0_0_20px_rgba(213,82,163,0.10)]"
            />
          </div>
        </form>

        <div id="articls" class="flex flex-col gap-5">
          <article
            class="group relative z-10 overflow-hidden rounded-2xl border border-white/10 bg-white/[0.04] p-5 transition-all duration-300 hover:-translate-y-1 hover:border-[#D552A3]/40 hover:bg-white/[0.06] hover:shadow-[0_8px_35px_rgba(142,30,162,0.18)] md:p-6"
          >
            <div
              class="flex flex-col justify-between gap-6 xl:flex-row xl:items-center"
            >
              <div class="flex items-start gap-4">
                <div class="relative shrink-0">
                  <img
                    src="./assets/Image/profil default instagram.jpeg"
                    alt="Profile image"
                    class="h-16 w-16 rounded-2xl border-2 border-[#D552A3]/40 object-cover shadow-[0_0_20px_rgba(213,82,163,0.15)] transition-all duration-300 group-hover:border-[#D552A3]"
                  />
                  <span
                    class="absolute -bottom-1 -right-1 h-4 w-4 rounded-full border-2 border-[#100B16] bg-green-400"
                  ></span>
                </div>

                <div class="flex flex-col gap-2">
                  <h3
                    class="text-lg font-bold text-white transition-colors group-hover:text-[#F49ACD]"
                  >
                    Users
                  </h3>

                  <div
                    class="flex flex-wrap items-center gap-2 text-sm text-gray-400"
                  >
                    <span>@user</span>
                    <span class="h-1 w-1 rounded-full bg-gray-600"></span>
                    <span
                      class="rounded-md border border-[#8E1EA2]/30 bg-[#8E1EA2]/15 px-2 py-1 text-xs font-semibold text-[#DDA0E8]"
                    >
                      Java
                    </span>
                  </div>

                  <p class="text-sm text-gray-300">Test</p>

                  <p class="flex items-center gap-2 text-xs text-gray-500">
                    <i class="fa-regular fa-calendar text-[#D552A3]"></i>
                    Ajouté le 06/11/2026
                  </p>
                </div>
              </div>

              <div
                class="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between xl:justify-end"
              >
                <div
                  class="flex items-center gap-3 rounded-xl border border-white/10 bg-black/20 px-4 py-3"
                >
                  <div class="flex items-center gap-1 text-sm">
                    <i class="fa-solid fa-star text-yellow-400"></i>
                    <i class="fa-solid fa-star text-yellow-400"></i>
                    <i class="fa-solid fa-star text-yellow-400"></i>
                    <i class="fa-regular fa-star text-gray-600"></i>
                    <i class="fa-regular fa-star text-gray-600"></i>
                  </div>
                  <span class="text-xs font-semibold text-gray-400">3/5</span>
                </div>

                <div class="flex flex-wrap items-center gap-2">
                  <button
                    type="button"
                    class="rounded-xl border border-red-500/20 bg-red-500/10 px-4 py-2.5 text-xs font-bold text-red-400 transition-all duration-300 hover:border-red-500/50 hover:bg-red-500/20 hover:shadow-[0_0_15px_rgba(239,68,68,0.15)]"
                  >
                    <i class="fa-solid fa-xmark mr-1"></i>
                    REFUSÉ
                  </button>

                  <button
                    type="button"
                    class="rounded-xl border border-[#D552A3]/30 bg-gradient-to-r from-[#8E1EA2]/20 to-[#D552A3]/10 px-4 py-2.5 text-xs font-bold text-[#F49ACD] transition-all duration-300 hover:border-[#D552A3]/60 hover:from-[#8E1EA2]/40 hover:to-[#D552A3]/30 hover:shadow-[0_0_20px_rgba(213,82,163,0.15)]"
                  >
                    <i class="fa-solid fa-pen-to-square mr-1"></i>
                    Modifier
                  </button>

                  <button
                    type="button"
                    class="rounded-xl border border-white/10 bg-white/[0.04] px-4 py-2.5 text-xs font-bold text-gray-400 transition-all duration-300 hover:border-red-500/40 hover:bg-red-500/10 hover:text-red-400"
                  >
                    <i class="fa-solid fa-trash-can mr-1"></i>
                    Supprimer
                  </button>
                </div>
              </div>
            </article>

             <article
            class="group relative z-10 overflow-hidden rounded-2xl border border-white/10 bg-white/[0.04] p-5 transition-all duration-300 hover:-translate-y-1 hover:border-[#D552A3]/40 hover:bg-white/[0.06] hover:shadow-[0_8px_35px_rgba(142,30,162,0.18)] md:p-6"
          >
            <div
              class="flex flex-col justify-between gap-6 xl:flex-row xl:items-center"
            >
              <div class="flex items-start gap-4">
                <div class="relative shrink-0">
                  <img
                    src="./assets/Image/profil default instagram.jpeg"
                    alt="Profile image"
                    class="h-16 w-16 rounded-2xl border-2 border-[#D552A3]/40 object-cover shadow-[0_0_20px_rgba(213,82,163,0.15)] transition-all duration-300 group-hover:border-[#D552A3]"
                  />
                  <span
                    class="absolute -bottom-1 -right-1 h-4 w-4 rounded-full border-2 border-[#100B16] bg-green-400"
                  ></span>
                </div>

                <div class="flex flex-col gap-2">
                  <h3
                    class="text-lg font-bold text-white transition-colors group-hover:text-[#F49ACD]"
                  >
                    Users
                  </h3>

                  <div
                    class="flex flex-wrap items-center gap-2 text-sm text-gray-400"
                  >
                    <span>@user</span>
                    <span class="h-1 w-1 rounded-full bg-gray-600"></span>
                    <span
                      class="rounded-md border border-[#8E1EA2]/30 bg-[#8E1EA2]/15 px-2 py-1 text-xs font-semibold text-[#DDA0E8]"
                    >
                      Java
                    </span>
                  </div>

                  <p class="text-sm text-gray-300">Test</p>

                  <p class="flex items-center gap-2 text-xs text-gray-500">
                    <i class="fa-regular fa-calendar text-[#D552A3]"></i>
                    Ajouté le 06/11/2026
                  </p>
                </div>
              </div>

              <div
                class="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between xl:justify-end"
              >
                <div
                  class="flex items-center gap-3 rounded-xl border border-white/10 bg-black/20 px-4 py-3"
                >
                  <div class="flex items-center gap-1 text-sm">
                    <i class="fa-solid fa-star text-yellow-400"></i>
                    <i class="fa-solid fa-star text-yellow-400"></i>
                    <i class="fa-solid fa-star text-yellow-400"></i>
                    <i class="fa-regular fa-star text-gray-600"></i>
                    <i class="fa-regular fa-star text-gray-600"></i>
                  </div>
                  <span class="text-xs font-semibold text-gray-400">3/5</span>
                </div>

                <div class="flex flex-wrap items-center gap-2">
                  <button
                    type="button"
                    class="rounded-xl border border-red-500/20 bg-red-500/10 px-4 py-2.5 text-xs font-bold text-red-400 transition-all duration-300 hover:border-red-500/50 hover:bg-red-500/20 hover:shadow-[0_0_15px_rgba(239,68,68,0.15)]"
                  >
                    <i class="fa-solid fa-xmark mr-1"></i>
                    REFUSÉ
                  </button>

                  <button
                    type="button"
                    class="rounded-xl border border-[#D552A3]/30 bg-gradient-to-r from-[#8E1EA2]/20 to-[#D552A3]/10 px-4 py-2.5 text-xs font-bold text-[#F49ACD] transition-all duration-300 hover:border-[#D552A3]/60 hover:from-[#8E1EA2]/40 hover:to-[#D552A3]/30 hover:shadow-[0_0_20px_rgba(213,82,163,0.15)]"
                  >
                    <i class="fa-solid fa-pen-to-square mr-1"></i>
                    Modifier
                  </button>

                  <button
                    type="button"
                    class="rounded-xl border border-white/10 bg-white/[0.04] px-4 py-2.5 text-xs font-bold text-gray-400 transition-all duration-300 hover:border-red-500/40 hover:bg-red-500/10 hover:text-red-400"
                  >
                    <i class="fa-solid fa-trash-can mr-1"></i>
                    Supprimer
                  </button>
                </div>
              </div>
            </article>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
