<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <script type="module" src="./src/shortlistHtml.js" defer></script>

    <title>DevScope | Shortlist</title>
  </head>
  <body class="bg-gray-950 text-white overflow-hidden">
    <header
      class="relative z-20 flex w-[90%] lg:w-[80%] mx-auto my-8 items-center justify-between gap-4 rounded-full border border-white/10 bg-white/[0.06] backdrop-blur-xl shadow-[0_8px_35px_rgba(142,30,162,0.2)] px-5 py-3 before:content-[''] before:absolute before:inset-0 before:rounded-full before:border before:border-white/10 before:pointer-events-none"
    >
      <a href="./index.html" class="relative z-10 shrink-0">
        <img
          src="./assets/Image/logo.png"
          alt="DevScope Logo"
          class="w-24 md:w-28 object-contain"
        />
      </a>

      <nav class="relative z-10">
        <ul class="flex items-center gap-2 md:gap-4">
          <li>
            <a
              href="./index.html"
              class="block rounded-full border border-[#8E1EA2]/40 bg-[#8E1EA2]/15 px-5 py-2.5 text-sm font-semibold transition-all duration-300 hover:bg-[#8E1EA2]/30 hover:border-[#D552A3]/70 hover:shadow-[0_0_20px_rgba(142,30,162,0.4)]"
            >
              Recherche
            </a>
          </li>

          <li>
            <a
              href="./shortlist.html"
              class="block rounded-full border border-white/10 bg-white/5 px-5 py-2.5 text-sm font-semibold transition-all duration-300 hover:bg-[#D552A3]/15 hover:border-[#D552A3]/50 hover:shadow-[0_0_20px_rgba(213,82,163,0.3)]"
            >
              Shortlist
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <div class="absolute w-full inset-0 overflow-hidden pointer-events-none">
      <div
        class="absolute w-[550px] h-[550px] rounded-full bg-[#8E1EA2]/20 blur-[140px] -top-[250px] -left-[200px]"
      ></div>

      <div
        class="absolute w-[450px] h-[450px] rounded-full bg-[#D552A3]/15 blur-[130px] -top-[150px] -right-[150px]"
      ></div>

      <div
        class="absolute w-[700px] h-[400px] rounded-full bg-[#8E1EA2]/15 blur-[150px] top-[30%] left-1/2 -translate-x-1/2"
      ></div>

      <div
        class="absolute w-[500px] h-[500px] rounded-full bg-[#D552A3]/10 blur-[140px] -bottom-[250px] -left-[200px]"
      ></div>

      <div
        class="absolute w-[600px] h-[500px] rounded-full bg-[#8E1EA2]/20 blur-[150px] -bottom-[250px] -right-[200px]"
      ></div>

      <div
        class="absolute w-[900px] h-[180px] rotate-[-25deg] rounded-full bg-[#D552A3]/10 blur-[100px] top-[45%] -left-[200px]"
      ></div>
    </div>

    <div
      id="popap"
      class="fixed inset-0 z-50 flex items-center justify-center bg-[#09060D]/80 px-4 backdrop-blur-sm"
      hidden
    >
      <form
        action=""
        class="relative w-full max-w-md overflow-hidden rounded-2xl border border-[#D552A3]/30 bg-[#100B16] p-7 text-white shadow-[0_20px_80px_rgba(142,30,162,0.3)]"
      >
        <div
          class="pointer-events-none absolute -right-20 -top-20 h-52 w-52 rounded-full bg-[#8E1EA2]/20 blur-3xl"
        ></div>

        <div class="relative mb-7 flex items-start justify-between">
          <div>
            <h2 class="text-xl font-bold tracking-wide text-white">
              Update user
            </h2>
            <p class="mt-2 text-sm text-gray-400">Enter your formation user</p>
          </div>

          <button
            type="button"
            class="clos-opan flex h-9 w-9 cursor-pointer items-center justify-center rounded-xl border border-white/10 bg-white/5 text-gray-400 transition-all duration-300 hover:border-[#D552A3]/50 hover:bg-[#D552A3]/20 hover:text-white"
          >
            X
          </button>
        </div>

        <div class="relative space-y-5">
          <div class="flex flex-col gap-2">
            <label for="name" class="text-sm font-medium text-gray-300">
              Name
            </label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="My Awesome Project"
              required
              class="w-full rounded-xl border border-white/10 bg-white/[0.05] px-4 py-3 text-sm text-white outline-none transition-all duration-300 placeholder:text-gray-600 focus:border-[#D552A3]/60 focus:bg-white/[0.08] focus:ring-2 focus:ring-[#8E1EA2]/20"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label for="des" class="text-sm font-medium text-gray-300">
              Description
            </label>
            <input
              type="text"
              id="des"
              name="description"
              placeholder="Describe your repository..."
              required
              class="w-full rounded-xl border border-white/10 bg-white/[0.05] px-4 py-3 text-sm text-white outline-none transition-all duration-300 placeholder:text-gray-600 focus:border-[#D552A3]/60 focus:bg-white/[0.08] focus:ring-2 focus:ring-[#8E1EA2]/20"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label for="log" class="text-sm font-medium text-gray-300">
              Language
            </label>
            <input
              type="text"
              id="log"
              name="language"
              placeholder="JavaScript, Python, Java..."
              required
              class="w-full rounded-xl border border-white/10 bg-white/[0.05] px-4 py-3 text-sm text-white outline-none transition-all duration-300 placeholder:text-gray-600 focus:border-[#D552A3]/60 focus:bg-white/[0.08] focus:ring-2 focus:ring-[#8E1EA2]/20"
            />
          </div>
        </div>

        <div class="relative mt-8 flex gap-3">
          <button
            id="submit"
            type="button"
            class="flex-1 cursor-pointer rounded-xl bg-gradient-to-r from-[#8E1EA2] to-[#D552A3] px-4 py-3 text-sm font-semibold text-white shadow-[0_5px_20px_rgba(142,30,162,0.25)] transition-all duration-300 hover:brightness-110 hover:shadow-[0_5px_25px_rgba(213,82,163,0.4)]"
          >
            update user
          </button>
        </div>
      </form>
    </div>

    <div
      id="deletePopup"
      class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 px-4 backdrop-blur-sm"
      hidden
    > 
      <div
        class="relative w-full max-w-md rounded-2xl border border-[#D552A3]/30 bg-[#100B16] p-7 text-center text-white shadow-[0_20px_80px_rgba(142,30,162,0.3)]"
      >
        <div
          class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-full bg-red-500/10 text-red-400"
        >
          <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
        </div>

        <h2 class="mb-2 text-xl font-bold">Confirmer la suppression</h2>

        <p class="mb-7 text-sm leading-6 text-gray-400">
          Êtes-vous sûr de vouloir supprimer ce candidat ? Cette action est
          irréversible.
        </p>

        <div class="flex justify-center gap-3">
          <button
            type="button"
            id="cancelDelete"
            class="flex-1 cursor-pointer rounded-xl border border-white/10 bg-white/5 px-5 py-3 text-sm font-medium text-gray-300 transition-all hover:bg-white/10 hover:text-white"
          >
            Annuler
          </button>

          <button
            type="button"
            id="confirmDelete"
            class="flex-1 cursor-pointer rounded-xl bg-gradient-to-r from-red-600 to-red-500 px-5 py-3 text-sm font-semibold text-white transition-all hover:brightness-110 hover:shadow-[0_5px_20px_rgba(239,68,68,0.3)]"
          >
            Confirmer
          </button>
        </div>
      </div>
    </div>

    <main>
      <section class="flex flex-col gap-5 p-10">
        <div
          class="pointer-events-none absolute -right-20 -top-20 h-64 w-64 rounded-full bg-[#8E1EA2]/10 blur-[100px]"
        ></div>
        <div
          class="pointer-events-none absolute -bottom-20 -left-20 h-64 w-64 rounded-full bg-[#D552A3]/10 blur-[100px]"
        ></div>

        <div
          class="relative z-10 flex flex-col justify-between gap-4 sm:flex-row sm:items-center"
        >
          <div>
            <h2
              class="bg-gradient-to-r from-[#D552A3] to-[#8E1EA2] bg-clip-text text-3xl font-bold text-transparent"
            >
              Ma shortlist
            </h2>
            <p class="mt-2 text-sm text-gray-400">
              <span class="font-bold text-[#D552A3]">1</span>
              candidat(s) dans votre shortlist
            </p>
          </div>

          <div
            class="flex h-12 w-12 items-center justify-center rounded-xl border border-[#D552A3]/20 bg-[#D552A3]/10 text-[#D552A3]"
          >
            <i class="fa-solid fa-bookmark text-xl"></i>
          </div>
        </div>

        <form
          action=""
          class="relative z-10 flex flex-col justify-between gap-5 lg:flex-row lg:items-center"
        >
          <ul class="flex flex-wrap items-center gap-2 text-sm">
            <li>
              <button
                type="button"
                class="rounded-xl border border-[#D552A3]/40 bg-gradient-to-r from-[#8E1EA2]/30 to-[#D552A3]/20 px-4 py-2 font-semibold text-[#F49ACD] shadow-[0_0_15px_rgba(213,82,163,0.12)] transition-all hover:scale-105"
              >
                Tous
              </button>
            </li>

            <li>
              <button
                type="button"
                class="rounded-xl border border-white/10 bg-white/[0.04] px-4 py-2 text-gray-400 transition-all hover:border-[#D552A3]/40 hover:bg-[#D552A3]/10 hover:text-white"
              >
                A contacter
              </button>
            </li>

            <li>
              <button
                type="button"
                class="rounded-xl border border-white/10 bg-white/[0.04] px-4 py-2 text-gray-400 transition-all hover:border-[#D552A3]/40 hover:bg-[#D552A3]/10 hover:text-white"
              >
                Entretien
              </button>
            </li>

            <li>
              <button
                type="button"
                class="rounded-xl border border-white/10 bg-white/[0.04] px-4 py-2 text-gray-400 transition-all hover:border-[#D552A3]/40 hover:bg-[#D552A3]/10 hover:text-white"
              >
                Retenu
              </button>
            </li>

            <li>
              <button
                type="button"
                class="rounded-xl border border-white/10 bg-white/[0.04] px-4 py-2 text-gray-400 transition-all hover:border-[#D552A3]/40 hover:bg-[#D552A3]/10 hover:text-white"
              >
                Refusé
              </button>
            </li>
          </ul>

          <div class="group relative w-full lg:w-72">
            <i
              class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 transition-colors group-focus-within:text-[#D552A3]"
            ></i>

            <input
              type="search"
              placeholder="Rechercher un candidat..."
              class="w-full rounded-xl border border-white/10 bg-white/[0.04] py-3 pl-11 pr-4 text-sm text-white outline-none transition-all placeholder:text-gray-500 focus:border-[#D552A3]/50 focus:bg-[#D552A3]/[0.05] focus:shadow-[0_0_20px_rgba(213,82,163,0.10)]"
            />
          </div>
        </form>

        <div
          id="articls"
          class="flex flex-col gap-5 h-[88vh] scrollbar-none overflow-y-auto"
        ></div>
      </section>
    </main>
  </body>
</html>
