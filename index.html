<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="./src/utlis.js" defer></script>

    <title>DevScope | Recherche</title>
  </head>
  <body class="bg-gray-950 text-white">
    <header
      class="relative z-20 flex w-[90%] lg:w-[80%] mx-auto my-8 items-center justify-between gap-4 rounded-full border border-white/10 bg-white/[0.06] backdrop-blur-xl shadow-[0_8px_35px_rgba(142,30,162,0.2)] px-5 py-3 before:content-[''] before:absolute before:inset-0 before:rounded-full before:border before:border-white/10 before:pointer-events-none"
    >
      <a href="./index.html" class="relative z-10 shrink-0">
        <img
          src="./assets/Image/logo.png"
          alt="DevScope Logo"
          class="w-24 md:w-28 object-contain"
        />
      </a>

      <nav class="relative z-10">
        <ul class="flex items-center gap-2 md:gap-4">
          <li>
            <a
              href="./index.html"
              class="block rounded-full border border-[#8E1EA2]/40 bg-[#8E1EA2]/15 px-5 py-2.5 text-sm font-semibold transition-all duration-300 hover:bg-[#8E1EA2]/30 hover:border-[#D552A3]/70 hover:shadow-[0_0_20px_rgba(142,30,162,0.4)]"
            >
              Recherche
            </a>
          </li>

          <li>
            <a
              href="./shortlist.html"
              class="block rounded-full border border-white/10 bg-white/5 px-5 py-2.5 text-sm font-semibold transition-all duration-300 hover:bg-[#D552A3]/15 hover:border-[#D552A3]/50 hover:shadow-[0_0_20px_rgba(213,82,163,0.3)]"
            >
              Shortlist
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div
        class="absolute w-[550px] h-[550px] rounded-full bg-[#8E1EA2]/20 blur-[140px] -top-[250px] -left-[200px]"
      ></div>

      <div
        class="absolute w-[450px] h-[450px] rounded-full bg-[#D552A3]/15 blur-[130px] -top-[150px] -right-[150px]"
      ></div>

      <div
        class="absolute w-[700px] h-[400px] rounded-full bg-[#8E1EA2]/15 blur-[150px] top-[30%] left-1/2 -translate-x-1/2"
      ></div>

      <div
        class="absolute w-[500px] h-[500px] rounded-full bg-[#D552A3]/10 blur-[140px] -bottom-[250px] -left-[200px]"
      ></div>

      <div
        class="absolute w-[600px] h-[500px] rounded-full bg-[#8E1EA2]/20 blur-[150px] -bottom-[250px] -right-[200px]"
      ></div>

      <div
        class="absolute w-[900px] h-[180px] rotate-[-25deg] rounded-full bg-[#D552A3]/10 blur-[100px] top-[45%] -left-[200px]"
      ></div>
    </div>

    <main>
      <section
        class="flex flex-col justify-center items-center h-[40vh] gap-10"
      >
        <h1
          class="text-center text-6xl font-bold bg-linear-to-r from-purple-800 via-rose-950 to-white bg-clip-text text-transparent gradient-text"
        >
          Trouvez les meilleurs <br />
          développeurs grace a leur<br />code
        </h1>
        <p class="font-bold text-shadow-sm text-shadow-white/20">
          Analysez un profile, ses project et ses langages en quelues secondes.
        </p>

        <div class="relative w-full max-w-xl group">
          <div
            class="absolute -inset-[1px] rounded-2xl bg-gradient-to-r from-[#8E1EA2] to-[#D552A3] opacity-30 blur-md transition duration-300 group-focus-within:opacity-70"
          ></div>

          <div
            class="relative flex items-center gap-3 rounded-2xl border border-white/10 bg-white/[0.06] backdrop-blur-xl px-5 py-4 transition-all duration-300 group-focus-within:border-[#D552A3]/50 group-focus-within:bg-white/[0.09]"
          >
            <svg
              class="w-5 h-5 text-[#D552A3] shrink-0"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <circle cx="11" cy="11" r="7" stroke-width="2" />
              <path d="m16 16 4 4" stroke-width="2" stroke-linecap="round" />
            </svg>

            <input
              type="search"
              name="search"
              id="search"
              placeholder="Search any users..."
              class="w-full bg-transparent outline-none text-white placeholder:text-gray-500 text-sm tracking-wide"
            />

            <span
              id="submit"
              class="hidden sm:block text-xs text-white border border-white/10 rounded-lg px-2 py-1 cursor-pointer"
            >
              Search
            </span>
          </div>
        </div>

        <div id="Error"></div>
        <div id="loding"></div>
      </section>
    </main>
  </body>
</html>
